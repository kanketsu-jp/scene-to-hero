<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scene to Hero</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f7fa;
        --panel: #fff;
        --text: #17202a;
        --muted: #52606d;
        --line: #cbd2d9;
        --accent: #155eef;
        --error: #b42318;
        --warn: #9a6700;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111827;
          --panel: #1f2937;
          --text: #f3f4f6;
          --muted: #c4cdd5;
          --line: #4b5563;
          --accent: #8db4ff;
          --error: #ffb4ab;
          --warn: #f5c36a;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 1.5rem; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, sans-serif; }
      main, .header { max-width: 1100px; margin: auto; }
      .header { display: flex; justify-content: space-between; gap: 1rem; align-items: end; flex-wrap: wrap; }
      .hint { color: var(--muted); }
      .toolbar { display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; margin: 1rem 0; }
      .messages { min-height: 2rem; }
      .error { color: var(--error); }
      .warning { color: var(--warn); }
      button, select, input, textarea { font: inherit; }
      button { padding: .45rem .7rem; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 1rem; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1rem; }
      .card.dragging { opacity: .5; }
      .card.drop-target { outline: 3px solid var(--accent); }
      .thumb { height: 150px; display: grid; place-items: center; background: var(--bg); margin-bottom: .75rem; color: var(--muted); overflow: hidden; }
      .thumb img { width: 100%; height: 100%; object-fit: contain; }
      .meta { color: var(--muted); overflow-wrap: anywhere; }
      .controls { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-top: .75rem; }
      .note { width: 100%; min-height: 4rem; margin-top: .5rem; background: var(--panel); color: var(--text); border: 1px solid var(--line); }
    </style>
  </head>
  <body>
    <header class="header">
      <div>
        <h1>Scene to Hero</h1>
        <p class="hint">Arrange scenes, choose the final image, and download the updated project.</p>
      </div>
    </header>
    <main>
      <div class="toolbar">
        <label>Project <input id="json" type="file" accept=".json,application/json"></label>
        <label>Images <input id="images" type="file" multiple accept="image/*"></label>
        <button id="download" type="button" disabled>Download project.json</button>
        <button id="save" type="button" disabled hidden>Save</button>
      </div>
      <p class="hint">After downloading, save the file over the project's project.json.</p>
      <section id="messages" class="messages" aria-live="polite"></section>
      <section id="grid" class="grid" aria-label="Scenes"></section>
    </main>
    <script src="logic.js"></script>
    <script>
      (() => {
        const U = globalThis.SceneUI;
        const state = { project: null, scenes: [], files: [], urls: [], projectWarning: null };
        const grid = document.querySelector('#grid');
        const messages = document.querySelector('#messages');
        const download = document.querySelector('#download');
        const save = document.querySelector('#save');
        let projectUrl = null;
        let served = false;

        function show() {
          messages.textContent = '';
          messages.className = 'messages';
          if (state.projectWarning) {
            const warning = document.createElement('div');
            warning.className = 'warning';
            warning.textContent = state.projectWarning;
            messages.append(warning);
          }
          if (!state.project) {
            download.disabled = true;
            save.disabled = true;
            return;
          }
          const validation = U.validateProject(state.project);
          if (validation.errors.length) {
            const error = document.createElement('div');
            error.className = 'error';
            error.textContent = validation.errors.join(' ');
            messages.append(error);
          }
          if (validation.warnings.length) {
            const warning = document.createElement('div');
            warning.className = 'warning';
            warning.textContent = validation.warnings.join(' ');
            messages.append(warning);
          }
          download.disabled = validation.errors.length > 0;
          save.disabled = validation.errors.length > 0;
        }

        function imageFor(scene) {
          if (projectUrl) return U.resolveSceneUrl(projectUrl, scene.path, location.href);
          const file = U.matchImageFiles([scene], state.files)[scene.id];
          if (!file) return null;
          const url = URL.createObjectURL(file);
          state.urls.push(url);
          return url;
        }

        function render() {
          state.urls.splice(0).forEach(URL.revokeObjectURL);
          grid.textContent = '';
          if (!state.project) {
            show();
            return;
          }
          state.scenes = U.sortedScenes(state.project.scenes);
          state.scenes.forEach((scene, index) => {
            const card = document.createElement('article');
            card.className = 'card';
            card.draggable = true;
            card.dataset.id = scene.id;
            card.ondragstart = (event) => { event.dataTransfer.setData('text/plain', scene.id); card.classList.add('dragging'); };
            card.ondragend = () => card.classList.remove('dragging');
            card.ondragover = (event) => { event.preventDefault(); card.classList.add('drop-target'); };
            card.ondragleave = () => card.classList.remove('drop-target');
            card.ondrop = (event) => {
              event.preventDefault();
              card.classList.remove('drop-target');
              state.scenes = U.moveScene(state.scenes, state.scenes.findIndex((item) => item.id === event.dataTransfer.getData('text/plain')), index);
              state.project.scenes = state.scenes;
              render();
            };

            const thumb = document.createElement('div');
            thumb.className = 'thumb';
            const source = imageFor(scene);
            if (source) {
              const image = document.createElement('img');
              image.src = source;
              image.alt = scene.id;
              thumb.append(image);
            } else {
              thumb.textContent = 'no preview';
            }
            card.append(thumb);

            const title = document.createElement('strong');
            title.textContent = scene.id;
            card.append(title);
            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = `${scene.path} \u00b7 order ${scene.order}`;
            card.append(meta);

            const controls = document.createElement('div');
            controls.className = 'controls';
            const up = document.createElement('button');
            up.type = 'button';
            up.textContent = 'Up';
            up.setAttribute('aria-label', `Move ${scene.id} up`);
            up.disabled = index === 0;
            up.onclick = () => { state.scenes = U.moveSceneBy(state.scenes, scene.id, -1); state.project.scenes = state.scenes; render(); };
            const down = document.createElement('button');
            down.type = 'button';
            down.textContent = 'Down';
            down.setAttribute('aria-label', `Move ${scene.id} down`);
            down.disabled = index === state.scenes.length - 1;
            down.onclick = () => { state.scenes = U.moveSceneBy(state.scenes, scene.id, 1); state.project.scenes = state.scenes; render(); };
            controls.append(up, down);

            const importanceLabel = document.createElement('label');
            importanceLabel.textContent = ' Importance ';
            const select = document.createElement('select');
            for (let number = 1; number <= 5; number += 1) {
              const option = document.createElement('option');
              option.value = number;
              option.textContent = number;
              option.selected = scene.importance === number;
              select.append(option);
            }
            select.onchange = () => { state.scenes = U.setImportance(state.scenes, scene.id, Number(select.value)); state.project.scenes = state.scenes; render(); };
            importanceLabel.append(select);
            controls.append(importanceLabel);

            const finalLabel = document.createElement('label');
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'final';
            radio.checked = scene.role === 'final';
            radio.setAttribute('aria-label', `Set ${scene.id} as final`);
            radio.onchange = () => { state.scenes = U.setFinal(state.scenes, scene.id); state.project.scenes = state.scenes; render(); };
            finalLabel.append(radio, ' Final');
            controls.append(finalLabel);
            card.append(controls);

            const note = document.createElement('textarea');
            note.className = 'note';
            note.value = scene.note || '';
            note.placeholder = 'Note';
            note.setAttribute('aria-label', `Note for ${scene.id}`);
            note.oninput = () => { state.scenes = U.setNote(state.scenes, scene.id, note.value); state.project.scenes = state.scenes; show(); };
            card.append(note);
            grid.append(card);
          });
          show();
        }

        document.querySelector('#json').onchange = async (event) => {
          try {
            state.project = U.parseProject(await event.target.files[0].text());
            state.scenes = state.project.scenes;
            render();
          } catch (error) {
            messages.textContent = error.message;
            download.disabled = true;
          }
        };
        document.querySelector('#images').onchange = (event) => { state.files = Array.from(event.target.files); render(); };
        download.onclick = () => {
          const blob = new Blob([U.serializeProject(state.project, state.scenes)], { type: 'application/json' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'project.json';
          link.click();
          setTimeout(() => URL.revokeObjectURL(link.href), 0);
        };

        save.onclick = async () => {
          try {
            const validation = U.validateProject(state.project);
            if (validation.errors.length) throw Error(validation.errors.join(' '));
            const request = U.saveRequest(state.project, state.scenes);
            const response = await fetch(request.url, request.init);
            if (!response.ok) throw Error(await response.text());
            messages.textContent = 'Saved';
            messages.className = 'messages hint';
          } catch (error) {
            messages.textContent = error.message;
            messages.className = 'messages error';
          }
        };

        async function loadProject() {
          if (location.protocol === 'http:' || location.protocol === 'https:') {
            try {
              const response = await fetch('/api/project');
              served = response.ok;
            } catch (_) {
              served = false;
            }
          }
          const selected = U.defaultProjectUrl(location.search, served);
          projectUrl = selected.url;
          state.projectWarning = selected.warning;
          show();
          save.hidden = !served;
          if (projectUrl) {
            return fetch(projectUrl).then((response) => {
            if (!response.ok) throw Error(`Could not load project: ${response.status}`);
            return response.text();
          }).then((text) => {
            state.project = U.parseProject(text);
            state.scenes = state.project.scenes;
            render();
          }).catch((error) => {
            show();
            const failure = document.createElement('div');
            failure.className = 'error';
            failure.textContent = error.message;
            messages.append(failure);
            download.disabled = true;
          });
          }
        }
        loadProject();
      })();
    </script>
  </body>
</html>
