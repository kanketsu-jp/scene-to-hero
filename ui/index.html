<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>scene-to-hero</title>
<style>body{font:16px system-ui,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem;color:#222;background:#f7f7f7}h1{margin-bottom:.2rem}.hint{color:#555}.toolbar{display:flex;gap:1rem;flex-wrap:wrap;margin:1rem 0}button{padding:.6rem 1rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}.card{background:white;border:2px solid #ddd;border-radius:12px;padding:1rem;cursor:grab}.card.drag{opacity:.5}.thumb{height:150px;background:#eee;display:grid;place-items:center;margin-bottom:.7rem;overflow:hidden}.thumb img{max-width:100%;max-height:100%}.error{color:#a00;min-height:1.4rem}</style></head>
<body><h1>scene-to-hero</h1><p class="hint">ローカルで <code>python3 -m http.server</code> をリポジトリ直下または ui/ で起動し、ui/index.html を開いてください。project.json を選択して読み込むこともできます。</p>
<div class="toolbar"><input id="json" type="file" accept=".json,application/json"><input id="images" type="file" accept="image/png,image/jpeg,image/webp" multiple><button id="download">JSON をダウンロード</button></div><p id="error" class="error"></p><main id="grid" class="grid"></main>
<script>
const state={project:null,files:new Map()}; const grid=document.querySelector('#grid'), error=document.querySelector('#error');
function validate(p){if(!p||!/^[A-Za-z0-9._-]+$/.test(p.name))throw Error('プロジェクト名が不正です');const ids=p.scenes.map(s=>s.id),orders=p.scenes.map(s=>s.order);if(new Set(ids).size!==ids.length||new Set(orders).size!==orders.length)throw Error('id/order は重複できません');if(p.scenes.filter(s=>s.role==='final').length>1)throw Error('final は1枚までです');p.scenes.forEach(s=>{if(s.importance<1||s.importance>5)throw Error('重要度は1〜5です');if(!['final','reference'].includes(s.role))throw Error('role が不正です')})}
function render(){grid.innerHTML='';if(!state.project)return;state.project.scenes.sort((a,b)=>a.order-b.order).forEach((s,i)=>{s.order=i;const card=document.createElement('article');card.className='card';card.draggable=true;card.dataset.id=s.id;const box=document.createElement('div');box.className='thumb';const file=state.files.get(s.path);if(file){const img=document.createElement('img');img.src=URL.createObjectURL(file);box.append(img)}else{box.textContent='画像プレビューなし'}card.append(box);const title=document.createElement('strong');title.textContent=s.id+' · '+s.path;card.append(title);const label=document.createElement('label');label.textContent='重要度 ';const select=document.createElement('select');for(let n=1;n<=5;n++){const o=new Option(n,n,s.importance===n,s.importance===n);select.append(o)}select.onchange=()=>s.importance=Number(select.value);label.append(select);card.append(document.createElement('br'),label);const final=document.createElement('label');const radio=document.createElement('input');radio.type='radio';radio.name='final';radio.checked=s.role==='final';radio.onchange=()=>{state.project.scenes.forEach(x=>x.role=x===s?'final':'reference');render()};final.append(radio,' final');card.append(document.createElement('br'),final);card.ondragstart=e=>{e.dataTransfer.setData('text/plain',s.id);card.classList.add('drag')};card.ondragend=()=>card.classList.remove('drag');card.ondragover=e=>e.preventDefault();card.ondrop=e=>{e.preventDefault();const from=state.project.scenes.findIndex(x=>x.id===e.dataTransfer.getData('text/plain'));const to=state.project.scenes.findIndex(x=>x.id===s.id);const [moved]=state.project.scenes.splice(from,1);state.project.scenes.splice(to,0,moved);render()};grid.append(card)})}
document.querySelector('#json').onchange=async e=>{try{state.project=JSON.parse(await e.target.files[0].text());validate(state.project);render();error.textContent=''}catch(x){error.textContent=x.message}};
document.querySelector('#images').onchange=e=>{for(const f of e.target.files)state.files.set(f.name,f);render()};
document.querySelector('#download').onclick=()=>{try{validate(state.project);const blob=new Blob([JSON.stringify(state.project,null,2)+'\n'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='project.json';a.click();error.textContent=''}catch(x){error.textContent=x.message}};
const query=new URLSearchParams(location.search).get('project');if(query)fetch(query).then(r=>r.json()).then(p=>{state.project=p;validate(p);render()}).catch(e=>error.textContent=e.message);
</script></body></html>
